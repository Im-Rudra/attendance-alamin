name: Pages

# Deploys the web build of main to GitHub Pages: https://im-rudra.github.io/attendance-alamin/
# Opt-in: set the repo variable ENABLE_PAGES=true and Settings > Pages > Source = "GitHub Actions".
# The repo is public, so Pages is free. The site holds no data (each visitor's data lives in
# their own browser's IndexedDB); no COOP/COEP headers are needed (Arch 1.6).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  build:
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - id: probe
        name: Bootstrapped?
        run: |
          if [ -f .metadata ] && [ -d web ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages::web/ does not exist yet; dispatch bootstrap.yml first. Nothing deployed."
          fi

      - uses: subosito/flutter-action@v2
        if: steps.probe.outputs.ok == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Prepare
        if: steps.probe.outputs.ok == 'true'
        run: bash tool/ci_prepare.sh

      - name: Fetch drift web assets
        if: steps.probe.outputs.ok == 'true'
        run: bash tool/fetch_web_assets.sh

      - name: Build web (cache-busted, 404 fallback)
        if: steps.probe.outputs.ok == 'true'
        run: bash tool/build_web.sh --build-number=${{ github.run_number }}

      - uses: actions/upload-pages-artifact@v5
        if: steps.probe.outputs.ok == 'true'
        with:
          path: build/web

    outputs:
      deployable: ${{ steps.probe.outputs.ok }}

  deploy:
    needs: build
    if: needs.build.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
