name: Generate Android release keystore

# Manual, ONCE, before the first APK reaches the teacher (Arch 6.3).
#
# This repository is PUBLIC: any signed-in GitHub user can download a public repo's run
# artifacts. The keystore bundle is therefore ENCRYPTED before upload (AES-256, PBKDF2) with a
# passphrase you choose and store as the repo secret KEYSTORE_EXPORT_PASSPHRASE beforehand.
#
# Steps for the owner:
#   1. Settings > Secrets and variables > Actions > New secret KEYSTORE_EXPORT_PASSPHRASE
#      (a long random passphrase; keep it with your offline copy).
#   2. Run this workflow on main. Download the artifact "android-keystore-ENCRYPTED" (kept 1 day).
#   3. Decrypt locally in Git Bash (OpenSSL ships with Git for Windows):
#        openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in keystore-bundle.tar.gz.enc -out keystore-bundle.tar.gz
#        tar -xzf keystore-bundle.tar.gz
#   4. Create repo secrets from the files: ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD,
#      ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (paste each file's content exactly).
#   5. Keep upload.jks + the passwords OFFLINE (losing them = the teacher can never upgrade
#      without uninstalling, which wipes data). Delete the artifact and the decrypted files.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "generate" to create a NEW keystore (only once, ever)'
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: keystore
  cancel-in-progress: false

jobs:
  keystore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm
        if: inputs.confirm != 'generate'
        run: |
          echo "::error::Type 'generate' in the confirm input. A new keystore replaces nothing automatically, but only ONE may ever be used for the teacher's app."
          exit 1

      - name: Require the export passphrase
        env:
          EXPORT_PASSPHRASE: ${{ secrets.KEYSTORE_EXPORT_PASSPHRASE }}
        run: |
          if [ "${#EXPORT_PASSPHRASE}" -lt 16 ]; then
            echo "::error::Set the repo secret KEYSTORE_EXPORT_PASSPHRASE (at least 16 characters) first. The repo is public, so the bundle is never uploaded unencrypted."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore and encrypted bundle
        env:
          EXPORT_PASSPHRASE: ${{ secrets.KEYSTORE_EXPORT_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/ks"
          mkdir -p "$work/bundle" "$GITHUB_WORKSPACE/out"
          PASS="$(openssl rand -hex 16)"   # 32 chars, 128 bits
          [ "${#PASS}" -eq 32 ]
          echo "::add-mask::$PASS"
          ALIAS="upload"
          # PKCS12: the key password equals the store password.
          keytool -genkeypair -noprompt \
            -keystore "$work/bundle/upload.jks" -storetype PKCS12 \
            -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Hajira Khata, O=ImRudra, C=BD"
          keytool -list -keystore "$work/bundle/upload.jks" -storepass "$PASS" | grep -i "PrivateKeyEntry"
          base64 -w0 "$work/bundle/upload.jks" > "$work/bundle/ANDROID_KEYSTORE_B64.txt"
          printf '%s' "$PASS"  > "$work/bundle/ANDROID_KEYSTORE_PASSWORD.txt"
          printf '%s' "$PASS"  > "$work/bundle/ANDROID_KEY_PASSWORD.txt"
          printf '%s' "$ALIAS" > "$work/bundle/ANDROID_KEY_ALIAS.txt"
          cat > "$work/bundle/README.txt" <<'EOF'
          Create these GitHub repo secrets (Settings > Secrets and variables > Actions), pasting
          each file's content exactly:
            ANDROID_KEYSTORE_B64      <- ANDROID_KEYSTORE_B64.txt
            ANDROID_KEYSTORE_PASSWORD <- ANDROID_KEYSTORE_PASSWORD.txt
            ANDROID_KEY_PASSWORD      <- ANDROID_KEY_PASSWORD.txt
            ANDROID_KEY_ALIAS         <- ANDROID_KEY_ALIAS.txt
          Keep upload.jks and the passwords offline (two places). Losing them means the app can
          never be upgraded in place on the teacher's phone (uninstall wipes all data).
          EOF
          tar -C "$work/bundle" -czf "$work/keystore-bundle.tar.gz" .
          printf '%s' "$EXPORT_PASSPHRASE" > "$work/pass"
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -in "$work/keystore-bundle.tar.gz" \
            -out "$GITHUB_WORKSPACE/out/keystore-bundle.tar.gz.enc" \
            -pass "file:$work/pass"
          # Round-trip check, then wipe plaintext.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in "$GITHUB_WORKSPACE/out/keystore-bundle.tar.gz.enc" -pass "file:$work/pass" \
            | cmp - "$work/keystore-bundle.tar.gz"
          rm -rf "$work"
          ls -la "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v7
        with:
          name: android-keystore-ENCRYPTED
          path: out/keystore-bundle.tar.gz.enc
          if-no-files-found: error
          retention-days: 1
