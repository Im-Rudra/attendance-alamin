name: Commit generated schema dump

# Manual (Lead, after M3 and after every schemaVersion bump): dumps the drift schema of
# lib/data/db/app_database.dart to drift_schemas/drift_schema_v<N>.json and commits it to main.
# From then on ci.yml `check` fails when the schema changes without a schemaVersion bump.
on:
  workflow_dispatch:

permissions:
  contents: write   # push the dump
  actions: write    # dispatch ci.yml afterwards (GITHUB_TOKEN pushes do not trigger it)

concurrency:
  group: commit-generated
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Must run on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Dispatch commit-generated.yml on main (got ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Require the database
        run: |
          if [ ! -f lib/data/db/app_database.dart ]; then
            echo "::error::lib/data/db/app_database.dart does not exist on main yet (arrives in M3-A)."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Prepare (merge ARB, pub get, gen-l10n, build_runner)
        run: bash tool/ci_prepare.sh

      - name: Dump schema
        run: |
          mkdir -p drift_schemas
          dart run drift_dev schema dump lib/data/db/app_database.dart drift_schemas/
          ls -la drift_schemas

      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- drift_schemas
          if git diff --cached --quiet; then
            echo "::notice title=Schema dump::drift_schemas/ already up to date; nothing to commit."
            exit 0
          fi
          git commit -m "chore(schema): commit drift schema dump" \
                     -m "Generated by commit-generated.yml run ${{ github.run_id }}."
          git push origin HEAD:main

      - name: Dispatch CI on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "${{ github.repository }}" --ref main
