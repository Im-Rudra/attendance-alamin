name: Release

# Push a tag like v1.0.0 (see docs/RELEASE.md). Builds a SIGNED Android APK, the Windows zip
# (with VC++ runtime DLLs) and the web zip, then publishes a GitHub Release with SHA256SUMS.
# Version = tag (v1.2.3 -> 1.2.3), build number = run number (monotonic Android versionCode).
# A debug-signed APK is never published: without keystore secrets the android job fails.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
    steps:
      - id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          name="${tag#v}"
          if ! [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$tag' is not vMAJOR.MINOR.PATCH (for example v1.0.0)."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

  android:
    name: android apk (signed)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require keystore secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error title=No release keystore::ANDROID_KEYSTORE_B64 / _PASSWORD / ANDROID_KEY_ALIAS / _PASSWORD secrets are missing. Run keystore.yml once and create the secrets (docs/RELEASE.md). A debug-signed APK is never released."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true
      - name: Android SDK platform 37
        run: |
          set +o pipefail
          SDKM="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms/android-37" ]; then
            yes | "$SDKM" --install "platforms;android-37" > /dev/null || echo "::warning::sdkmanager could not install platforms;android-37; Gradle will try to auto-download it."
          fi
          yes | "$SDKM" --licenses > /dev/null || true
      - name: Prepare
        run: bash tool/ci_prepare.sh
      - name: Configure signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/upload.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload.jks"
          } > android/key.properties
      - name: Build APK
        run: >
          flutter build apk --release
          --build-name=${{ needs.version.outputs.name }}
          --build-number=${{ github.run_number }}
      - name: Verify the APK is release-signed (not the debug key)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          apksigner="$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -n1)"
          apk=build/app/outputs/flutter-apk/app-release.apk
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          if grep -qi "Android Debug" certs.txt; then
            echo "::error::APK is signed with the Android debug key. Refusing to release."
            exit 1
          fi
          keytool -list -keystore android/app/upload.jks -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
            | grep -i "SHA-256\|SHA256" | head -1 || true
      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "attendance-alamin-${{ needs.version.outputs.name }}.apk"
      - name: Remove signing material
        if: always()
        run: rm -f android/app/upload.jks android/key.properties
      - uses: actions/upload-artifact@v7
        with:
          name: rel-android
          path: attendance-alamin-${{ needs.version.outputs.name }}.apk
          if-no-files-found: error
          retention-days: 7

  windows:
    name: windows zip
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true
      - name: Prepare
        run: bash tool/ci_prepare.sh
      - name: Build Windows
        run: >
          flutter build windows --release
          --build-name=${{ needs.version.outputs.name }}
          --build-number=${{ github.run_number }}
      - name: Bundle VC++ runtime DLLs
        shell: pwsh
        run: |
          $dest = "build\windows\x64\runner\Release"
          foreach ($dll in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
            Copy-Item -Path (Join-Path $env:WINDIR "System32\$dll") -Destination $dest -Force
          }
      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "attendance-alamin-windows-${{ needs.version.outputs.name }}.zip" -Force
      - uses: actions/upload-artifact@v7
        with:
          name: rel-windows
          path: attendance-alamin-windows-${{ needs.version.outputs.name }}.zip
          if-no-files-found: error
          retention-days: 7

  web:
    name: web zip
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true
      - name: Prepare
        run: bash tool/ci_prepare.sh
      - name: Fetch drift web assets
        run: bash tool/fetch_web_assets.sh
      - name: Build web
        run: >
          bash tool/build_web.sh
          --build-name=${{ needs.version.outputs.name }}
          --build-number=${{ github.run_number }}
      - name: Zip (folder attendance-alamin/, serve it under /attendance-alamin/)
        run: |
          rm -rf site && mkdir site
          cp -r build/web site/attendance-alamin
          (cd site && zip -qr "../attendance-alamin-web-${{ needs.version.outputs.name }}.zip" attendance-alamin)
      - uses: actions/upload-artifact@v7
        with:
          name: rel-web
          path: attendance-alamin-web-${{ needs.version.outputs.name }}.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: github release
    needs: [version, android, windows, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rel-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Hajira Khata ${{ needs.version.outputs.name }}" \
            --notes "Version ${{ needs.version.outputs.name }}+${{ github.run_number }}. Android APK (release-signed, installs over the previous version and keeps data), Windows zip (unzip and run; VC++ runtime included), web zip. Verify downloads with SHA256SUMS.txt."
