name: Bootstrap platform folders

# Manual, run once (and again only when platform folders must be regenerated).
# Creates android/ windows/ web/ with `flutter create` (existing files such as pubspec.yaml,
# lib/ and analysis_options.yaml are kept), applies tool/platform_patches/apply.py, and commits
# android/ windows/ web/ pubspec.lock .metadata assets/fonts/ to main with GITHUB_TOKEN.
# A GITHUB_TOKEN push does not trigger ci.yml, so this workflow dispatches it explicitly.
on:
  workflow_dispatch:

permissions:
  contents: write   # push the bootstrap commit
  actions: write    # dispatch ci.yml / pages.yml afterwards

concurrency:
  group: bootstrap
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Must run on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Dispatch bootstrap.yml on main (got ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Require the platform patcher (M0-B)
        run: |
          if [ ! -f tool/platform_patches/apply.py ]; then
            echo "::error title=Missing apply.py::tool/platform_patches/apply.py is not on main. Merge M0-B (platform patcher) first, then re-run bootstrap.yml."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Flutter version
        run: flutter --version

      # Before flutter create: it runs pub get, and `generate: true` + l10n.yaml need lib/l10n/arb/.
      - name: Merge ARB fragments
        run: python3 tool/merge_arb.py

      - name: Fonts present and verified
        run: bash tool/fetch_fonts.sh

      - name: flutter create (keeps existing files)
        run: |
          flutter create --org com.imrudra --project-name attendance_alamin \
            --platforms=android,windows,web .

      - name: Drop the template counter test
        run: |
          if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then
            rm test/widget_test.dart
            echo "Removed template test/widget_test.dart"
          fi

      - name: Apply platform patches
        run: python3 tool/platform_patches/apply.py

      - name: Patches are idempotent (apply.py --verify)
        run: python3 tool/platform_patches/apply.py --verify

      - name: flutter pub get
        run: flutter pub get

      - name: Show what will be committed
        run: |
          git status --short -- android windows web pubspec.lock .metadata assets/fonts | head -200
          test -f .metadata || { echo "::error::flutter create did not write .metadata"; exit 1; }
          test -f pubspec.lock || { echo "::error::pubspec.lock missing after pub get"; exit 1; }

      - id: commit
        name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- android windows web pubspec.lock .metadata assets/fonts
          if git diff --cached --quiet; then
            echo "::notice title=Bootstrap::Nothing to commit; platform folders already up to date."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(bootstrap): flutter create android/windows/web + platform patches" \
                     -m "Generated by bootstrap.yml run ${{ github.run_id }} with Flutter ${{ env.FLUTTER_VERSION }}."
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch CI on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --repo "${{ github.repository }}" --ref main
          echo "::notice title=CI dispatched::ci.yml was dispatched on main."

      - name: Dispatch Pages (if enabled)
        if: vars.ENABLE_PAGES == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
