name: attendance_alamin
description: "Hajira Khata: offline-first attendance, fees and schedule for a coaching center."
publish_to: 'none'

# versionCode comes from CI (--build-number=${{ github.run_number }}), so it only ever grows.
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# Frozen after M0 (docs/council/04-plan.md section 0). Changes go through the Lead.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any                 # version is pinned by flutter_localizations; never pin it ourselves
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  drift: 2.35.4             # EXACT: must match web/sqlite3.wasm + web/drift_worker.js (tool/fetch_web_assets.sh)
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  archive: ^4.7.1           # pure-Dart gzip (works on web)
  crypto: ^3.0.8            # sha256
  file_picker: ^13.4.0      # pickFiles + saveFile(bytes:) on android/windows/web
  share_plus: ^13.3.1       # share reminder text / backup file
  url_launcher: ^6.3.3      # tel: links
  pdf: ^3.13.1              # payment slip PDF (A4 / 80 mm); pure Dart
  printing: ^5.15.1         # system print dialog + share PDF; only Printing.layoutPdf / sharePdf (its widgets are Material)
  image_picker: ^1.2.4      # optional student photo
  package_info_plus: ^10.2.2
  flutter_local_notifications: ^23.0.3  # android+windows scheduling; web = show() only
  timezone: ^0.11.2                    # TZDateTime for zonedSchedule (we pass UTC instants)
  phosphor_flutter: 2.1.0   # EXACT: fonts only (Regular + Fill) for BhorIcons; never import its Dart library (IconData is final on Flutter 3.47)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.35.3         # latest drift_dev; same minor as drift
  build_runner: ^2.17.1

flutter:
  generate: true
  uses-material-design: true

  # Hind Siliguri, fork bdeshi/Hind-Siliguri @ 247a09fb574ba113068300e7118baab0daa2ad21 (fixed ১ glyph).
  # Committed TTFs; hashes in tool/fonts.sha256 are re-checked by CI. License: assets/fonts/hind_siliguri/OFL.txt
  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/hind_siliguri/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/hind_siliguri/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/hind_siliguri/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/hind_siliguri/HindSiliguri-Bold.ttf
          weight: 700
